
name: SOS Invoice Converter - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Locate static website output
        shell: bash
        run: |
          set -e

          echo "Searching for a static website with index.html..."

          for dir in .output/public dist/client dist public; do
            if [ -f "$dir/index.html" ]; then
              echo "Found static website output: $dir"
              echo "PAGES_DIR=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "ERROR: No recognized static output containing index.html."
          echo "Build output directories:"
          ls -la
          if [ -d .output ]; then
            find .output -maxdepth 3 -type f -name index.html
          fi
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
