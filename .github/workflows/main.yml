
name: SOS Invoice Converter - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Check build output
        run: |
          echo "Checking generated files..."
          if [ -d dist ]; then
            echo "Found dist directory"
          elif [ -d .output/public ]; then
            echo "Found .output/public directory"
          else
            echo "Build completed but no recognized static output directory was found."
            echo "Review the build output before configuring deployment."
            exit 1
          fi
